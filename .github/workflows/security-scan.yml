name: security-scan
on:
  pull_request:
  push:
    branches: [main]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action requires a paid license on GitHub organizations and
      # exits before any later step. The OSS CLI scans the same full history
      # (fetch-depth 0), redacts findings, and fails the job on leaks.
      # .gitleaks.toml and .gitleaksignore are picked up from the repo root.
      - name: gitleaks (secrets & credentials)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          curl --fail --silent --show-error --location \
            --output "${work}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | (cd "${work}" && sha256sum --check --strict -)
          tar --extract --gzip --file "${work}/${archive}" --directory "${work}" gitleaks
          "${work}/gitleaks" version
          "${work}/gitleaks" git --log-opts=--all --redact --verbose --exit-code=1 .
      - name: PII scan (personal identifiers)
        run: |
          if git grep -nEi 'dearwolf|wmd@|nkp@|blxmp\.dk|hermeswebui|lsv2_pt_[a-f0-9]+' -- . ':!.gitignore' ':!.github'; then
            echo "::error::Personal identifiers or live API keys found in the public repo — remove them before merging."
            exit 1
          fi
      - name: Python syntax + tests
        run: |
          pip install --quiet -r requirements.txt pytest
          python -m pytest -q
